name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Whole suite on Linux and Windows; on Windows it also runs install.ps1 against a local mirror (pwsh is preinstalled on both)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - if: runner.os == 'Linux'
        run: sh -n install/install.sh
