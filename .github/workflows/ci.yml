name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Whole suite on Linux, macOS and Windows with the oldest and the current supported Node; on Windows it also runs install.ps1 against a local mirror
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  installer-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh -n install/install.sh
      - run: shellcheck install/install.sh
